services:
  - type: web
    name: bookends-lms
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Email. Set these in the Render dashboard; sync:false means Render will
      # not read a value from this file, which is what keeps the key out of git.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      # Absolute origin used to build links inside emails. Without it the
      # templates omit the button rather than linking nowhere.
      - key: APP_URL
        sync: false
      # Web Push. The public key is baked into the client at BUILD time (it is
      # NEXT_PUBLIC_*), so changing it requires a redeploy, not just a restart.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT
        sync: false
